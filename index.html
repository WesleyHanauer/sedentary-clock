<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./public/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Timer</title>
</head>
<body class="bg-slate-600 flex flex-col items-center justify-center h-screen">
    <select name="timer-option" id="timerOption" onchange="selectChange()" class="flex flex-col items-center p-1 rounded mb-4 text-black">
        <option value="regularTimer">Regular timer</option>
        <option value="exerciseTimer">Exercise timer</option>
    </select>

    <form id="regularTimerForm" onsubmit="return false" class="flex flex-col items-center text-white space-y-2">
        <p>Hours</p>
        <input type="number" id="regularInputH" class="border border-slate-500 rounded-sm bg-slate-900">
        <p>Minutes</p>
        <input type="number" id="regularInputM" class="border border-slate-500 rounded-sm bg-slate-900">
        <p>Seconds</p>
        <input type="number" id="regularInputS" class="border border-slate-500 rounded-sm bg-slate-900">
        <button onclick="regularStartTimer()" class="rounded bg-slate-900 px-2"">
            Start timer
        </button>
        <button onclick="regularStopTimer()" class="rounded bg-slate-900 px-2"">
            Stop timer
        </button>
        <button onclick="regularResetTimer()" class="rounded bg-slate-900 px-2">
            Reset timer
        </button>
    </form>

    <form id="exerciseTimerForm" onsubmit="return false" class="flex flex-col items-center text-white space-y-2">
        <p>Exercising minutes</p>
        <input type="number" id="exerciseInputExercisingM" class="border border-slate-500 rounded-sm bg-slate-900">
        <p>Exercising seconds</p>
        <input type="number" id="exerciseInputExercisingS" class="border border-slate-500 rounded-sm bg-slate-900">
        <p>Separation minutes</p>
        <input type="number" id="exerciseInputSeparationS" class="border border-slate-500 rounded-sm bg-slate-900">
        <p>Separation seconds</p>
        <input type="number" id="exerciseInputSeparationM" class="border border-slate-500 rounded-sm bg-slate-900">
        <p>Loop?</p>
        <input id="exerciseLoop" type="checkbox">
        <button onclick="exerciseStartTimer()" class="rounded bg-slate-900 px-2"">
            Start timer
        </button>
        <button onclick="exerciseStopTimer()" class="rounded bg-slate-900 px-2"">
            Stop timer
        </button>
        <button onclick="exerciseResetTimer()" class="rounded bg-slate-900 px-2">
            Reset timer
        </button>
    </form>
    <script src="./scripts/setup.js"></script>
    <script src="./scripts/regularTimer.js"></script>
    <script src="./scripts/exerciseTimer.js"></script>
</body>
</html>
