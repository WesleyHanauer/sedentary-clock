<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./public/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Timer</title>
</head>
<body class="bg-slate-600 flex flex-col items-center justify-center h-screen">
    <select name="timer-option" id="timerOption" onchange="selectChange()" class="flex flex-col items-center p-1 rounded mb-4 text-black">
        <option value="regularTimer">Regular timer</option>
        <option value="exerciseTimer">Exercise timer</option>
    </select>

    <form id="regularTimerForm" onsubmit="return false" class="flex flex-col items-center text-white space-y-2">
        <p>Hours</p>
        <input type="number" id="inputH" class="border border-slate-500 rounded-sm bg-slate-900">
        <p>Minutes</p>
        <input type="number" id="inputM" class="border border-slate-500 rounded-sm bg-slate-900">
        <p>Seconds</p>
        <input type="number" id="inputS" class="border border-slate-500 rounded-sm bg-slate-900">
        <button onclick="startTimer()" class="rounded bg-slate-900 px-2"">
            Start timer
        </button>
        <button onclick="stopTimer()" class="rounded bg-slate-900 px-2"">
            Stop timer
        </button>
        <button onclick="resetTimer()" class="rounded bg-slate-900 px-2">
            Reset timer
        </button>
    </form>
    <script src="./scripts/setup.js"></script>
    <script src="./scripts/regularTimer.js"></script>
    <script src="./scripts/exerciseTimer.js"></script>
</body>
</html>
